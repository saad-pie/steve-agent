<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico-Claw Gateway - Saadpie</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 90%;
        }
        h2 { color: #58a6ff; margin-bottom: 10px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        .btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
            width: 100%;
        }
        .btn:hover { background-color: #2ea043; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error { color: #f85149; font-size: 13px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Pico-Claw Gateway</h2>
        <p id="status-text">Fetching your security session token...</p>
        <div class="spinner" id="loader"></div>
        <button id="launch-btn" class="btn">Open Pico-Claw Dashboard</button>
        <div class="error" id="error-msg"></div>
    </div>

    <script>
        async function prepareGateway() {
            const statusText = document.getElementById("status-text");
            const loader = document.getElementById("loader");
            const launchBtn = document.getElementById("launch-btn");
            const errorMsg = document.getElementById("error-msg");

            const hfBase = "https://saadpie1-pico-claw.hf.space";
            const githubTokenRaw = "https://raw.githubusercontent.com/saad-pie/deepseek-harness-storage/main/token.txt";

            try {
                statusText.innerText = "Connecting to GitHub storage vault...";
                const response = await fetch(githubTokenRaw, { cache: "no-store" });
                
                if (!response.ok) {
                    throw new Error("Token file not found yet. Hugging Face space might still be initializing.");
                }

                let tokenData = (await response.text()).trim();
                const cleanToken = tokenData.replace(/^token=/, '');

                statusText.innerText = "Session token ready! Click below to bypass DSH security check and open your dashboard.";
                loader.style.display = "none";
                
                // Configure button to open the target URL directly with the token
                launchBtn.style.display = "block";
                launchBtn.onclick = () => {
                    window.location.href = `${hfBase}/?token=${cleanToken}`;
                };

            } catch (err) {
                console.warn(err);
                try {
                    statusText.innerText = "Waiting for Hugging Face space to spin up...";
                    await fetch(hfBase, { method: "HEAD", mode: "no-cors" });
                    setTimeout(prepareGateway, 4000);
                } catch (fallbackErr) {
                    loader.style.display = "none";
                    errorMsg.innerText = "Connection failed. Please ensure your Hugging Face space is running.";
                }
            }
        }

        prepareGateway();
    </script>
</body>
</html>
