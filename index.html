<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico-Claw Gateway - Saadpie</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 90%;
        }
        h2 { color: #58a6ff; margin-bottom: 10px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 25px; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error { color: #f85149; font-size: 13px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Pico-Claw Gateway</h2>
        <p id="status-text">Fetching the latest dynamic security token from your private vault...</p>
        <div class="spinner" id="loader"></div>
        <div class="error" id="error-msg"></div>
    </div>

    <script>
        async function connectGateway() {
            const statusText = document.getElementById("status-text");
            const loader = document.getElementById("loader");
            const errorMsg = document.getElementById("error-msg");

            const hfBase = "https://saadpie1-pico-claw.hf.space";
            // Raw link to the auto-saved token file on your GitHub repository
            const githubTokenRaw = "https://raw.githubusercontent.com/saad-pie/deepseek-harness-storage/main/token.txt";

            try {
                statusText.innerText = "Connecting to GitHub storage vault...";
                const response = await fetch(githubTokenRaw, { cache: "no-store" });
                
                if (!response.ok) {
                    throw new Error("Token file not found yet. The Hugging Face space might still be initializing its first sync.");
                }

                let tokenData = (await response.text()).trim(); // Expected format: token=xyz...
                
                if (!tokenData.startsWith("token=")) {
                    tokenData = `token=${tokenData}`;
                }

                statusText.innerText = "Token acquired! Launching gateway...";
                loader.style.display = "none";

                // Instant redirect to your HF space with the live token attached
                setTimeout(() => {
                    window.location.replace(`${hfBase}/?${tokenData}`);
                }, 600);

            } catch (err) {
                console.warn(err, "Falling back to direct Hugging Face ping...");
                
                // Fallback: Try pinging the space directly if GitHub file isn't populated yet
                try {
                    statusText.innerText = "Waiting for Hugging Face space to spin up & sync token...";
                    const ping = await fetch(hfBase, { method: "HEAD", mode: "no-cors" });
                    setTimeout(connectGateway, 4000); // Retry loop
                } catch (fallbackErr) {
                    loader.style.display = "none";
                    errorMsg.innerText = "Connection failed. Please ensure your Hugging Face space is running.";
                }
            }
        }

        connectGateway();
    </script>
</body>
</html>
